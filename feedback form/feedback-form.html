<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
</head>
<body bgcolor="#f4f4f4">

  <br><br>

  <table width="520" cellpadding="0" cellspacing="0" border="0" align="center"
    style="background:#ffffff; border:1px solid #e0e0e0; border-radius:16px; padding:32px; font-family:sans-serif;">

    <tr>
      <td align="center">
        <h2 style="margin:0 0 4px 0; font-size:22px; font-weight:600; color:#111;">Share Your Feedback</h2>
        <p style="margin:0 0 28px 0; font-size:14px; color:#888;">We'd love to hear what you think.</p>
      </td>
    </tr>

    <tr>
      <td>
        <form action="#" method="post">

          <!-- Name -->
          <label style="display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px;">
            Full Name
          </label>
          <input
            type="text"
            name="name"
            placeholder="John Doe"
            required
            style="width:100%; padding:10px 12px; font-size:14px; border:1px solid #ddd;
                   border-radius:8px; outline:none; color:#111; box-sizing:border-box; margin-bottom:18px;">

          <!-- Email -->
          <label style="display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px;">
            Email Address
          </label>
          <input
            type="email"
            name="email"
            placeholder="john@example.com"
            required
            style="width:100%; padding:10px 12px; font-size:14px; border:1px solid #ddd;
                   border-radius:8px; outline:none; color:#111; box-sizing:border-box; margin-bottom:18px;">

          <!-- Category -->
          <label style="display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px;">
            Feedback Category
          </label>
          <select
            name="category"
            style="width:100%; padding:10px 12px; font-size:14px; border:1px solid #ddd;
                   border-radius:8px; outline:none; color:#111; box-sizing:border-box; margin-bottom:18px; background:#fff;">
            <option value="" disabled selected>Select a category</option>
            <option value="general">General</option>
            <option value="bug">Bug Report</option>
            <option value="feature">Feature Request</option>
            <option value="design">Design</option>
            <option value="other">Other</option>
          </select>

          <!-- Rating -->
          <label style="display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:10px;">
            Overall Rating
          </label>
          <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:18px;">
            <tr>
              <td style="padding-right:6px;">
                <input type="radio" name="rating" value="1" id="r1">
                <label for="r1" style="font-size:13px; color:#555;">1</label>
              </td>
              <td style="padding-right:6px;">
                <input type="radio" name="rating" value="2" id="r2">
                <label for="r2" style="font-size:13px; color:#555;">2</label>
              </td>
              <td style="padding-right:6px;">
                <input type="radio" name="rating" value="3" id="r3">
                <label for="r3" style="font-size:13px; color:#555;">3</label>
              </td>
              <td style="padding-right:6px;">
                <input type="radio" name="rating" value="4" id="r4">
                <label for="r4" style="font-size:13px; color:#555;">4</label>
              </td>
              <td style="padding-right:6px;">
                <input type="radio" name="rating" value="5" id="r5">
                <label for="r5" style="font-size:13px; color:#555;">5</label>
              </td>
              <td>
                <span style="font-size:12px; color:#aaa;">&nbsp;(1 = Poor, 5 = Excellent)</span>
              </td>
            </tr>
          </table>

          <!-- Experience checkboxes -->
          <label style="display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:10px;">
            What did you enjoy? (select all that apply)
          </label>
          <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:18px;">
            <tr>
              <td style="padding:4px 16px 4px 0;">
                <input type="checkbox" name="enjoy" value="ui" id="c1">
                <label for="c1" style="font-size:13px; color:#555;">UI Design</label>
              </td>
              <td style="padding:4px 16px 4px 0;">
                <input type="checkbox" name="enjoy" value="speed" id="c2">
                <label for="c2" style="font-size:13px; color:#555;">Speed</label>
              </td>
            </tr>
            <tr>
              <td style="padding:4px 16px 4px 0;">
                <input type="checkbox" name="enjoy" value="support" id="c3">
                <label for="c3" style="font-size:13px; color:#555;">Support</label>
              </td>
              <td style="padding:4px 16px 4px 0;">
                <input type="checkbox" name="enjoy" value="features" id="c4">
                <label for="c4" style="font-size:13px; color:#555;">Features</label>
              </td>
            </tr>
          </table>

          <!-- Recommend -->
          <label style="display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:10px;">
            Would you recommend us?
          </label>
          <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:18px;">
            <tr>
              <td style="padding-right:20px;">
                <input type="radio" name="recommend" value="yes" id="yes">
                <label for="yes" style="font-size:13px; color:#555;">Yes</label>
              </td>
              <td style="padding-right:20px;">
                <input type="radio" name="recommend" value="no" id="no">
                <label for="no" style="font-size:13px; color:#555;">No</label>
              </td>
              <td>
                <input type="radio" name="recommend" value="maybe" id="maybe">
                <label for="maybe" style="font-size:13px; color:#555;">Maybe</label>
              </td>
            </tr>
          </table>

          <!-- Message -->
          <label style="display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px;">
            Your Message
          </label>
          <textarea
            name="message"
            rows="4"
            placeholder="Tell us more about your experience..."
            required
            style="width:100%; padding:10px 12px; font-size:14px; border:1px solid #ddd;
                   border-radius:8px; outline:none; color:#111; box-sizing:border-box;
                   resize:vertical; font-family:sans-serif; margin-bottom:24px;"></textarea>

          <!-- Divider -->
          <hr style="border:none; border-top:1px solid #f0f0f0; margin-bottom:24px;">

          <!-- Buttons -->
          <table width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td width="48%">
                <input
                  type="reset"
                  value="Clear"
                  style="width:100%; padding:11px 0; font-size:14px; font-weight:500;
                         border:1px solid #ddd; border-radius:8px; background:#fff;
                         color:#555; cursor:pointer;">
              </td>
              <td width="4%"></td>
              <td width="48%">
                <input
                  type="submit"
                  value="Submit Feedback"
                  style="width:100%; padding:11px 0; font-size:14px; font-weight:500;
                         border:1px solid #185FA5; border-radius:8px; background:#185FA5;
                         color:#fff; cursor:pointer;">
              </td>
            </tr>
          </table>

        </form>
      </td>
    </tr>

    <!-- Footer note -->
    <tr>
      <td align="center" style="padding-top:20px;">
        <p style="font-size:12px; color:#bbb; margin:0;">
          Your feedback is kept private and used only to improve our service.
        </p>
      </td>
    </tr>

  </table>

  <br><br>

</body>
</html>
