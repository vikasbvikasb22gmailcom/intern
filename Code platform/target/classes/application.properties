# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./codearena-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=CodeArena_Super_Secret_Key_2024_MinLength32Chars!!
app.jwt.expiration=86400000

# Code Execution Timeout (ms)
app.execution.timeout=5000

# Logging
logging.level.com.codearena=INFO
