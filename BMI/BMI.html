<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }

        .underweight { color: orange; }
        .normal { color: green; }
        .overweight { color: darkorange; }
        .obese { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>BMI Calculator</h2>  <!-- ✅ FIXED -->

    <input type="number" id="weight" placeholder="Weight (kg)">
    <input type="number" id="height" placeholder="Height (cm)">

    <button onclick="calculateBMI()">Calculate</button>

    <p id="result"></p>
</div>

<script>
function calculateBMI() {
    let weight = parseFloat(document.getElementById("weight").value);
    let heightCm = parseFloat(document.getElementById("height").value);
    let result = document.getElementById("result");

    // Validation
    if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
        result.innerText = "Please enter valid values!";
        result.className = "";
        return;
    }

    // Convert cm to meters
    let height = heightCm / 100;

    let bmi = weight / (height * height);
    let category = "";
    let className = "";

    if (bmi < 18.5) {
        category = "Underweight";
        className = "underweight";
    } else if (bmi < 24.9) {
        category = "Normal weight";
        className = "normal";
    } else if (bmi < 29.9) {
        category = "Overweight";
        className = "overweight";
    } else {
        category = "Obese";
        className = "obese";
    }

    result.innerText = "BMI: " + bmi.toFixed(2) + " (" + category + ")";
    result.className = className;
}
</script>

</body>
</html>
